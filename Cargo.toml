[package]
name = "cc-gateway"
version = "0.1.0"
edition = "2021"
authors = ["caixinyun"]
description = "Gateway for controlling Claude Code via Feishu/Lark and CLI"
license = "MIT"
repository = "https://github.com/caixy-plus/cc-gateway"
keywords = ["claude", "claude-code", "feishu", "lark", "gateway"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cc-gateway"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.13"
bytes = "1.7"

# HTTP & WebSocket
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "local-time"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Config & paths
dirs = "5.0"

# Unix signals
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
once_cell = "1.20"
dashmap = "6.1"

# Interactive CLI (for cc-gateway without args)
rustyline = "14.0"
crossterm = "0.28"

# Path expansion
shellexpand = "3.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"
