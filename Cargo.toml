[package]
name = "cc-gateway"
version = "1.5.10"
edition = "2021"
authors = ["caixinyun"]
description = "Gateway for controlling Claude Code via Feishu/Lark, Telegram, and CLI"
license = "MIT"
repository = "https://github.com/caixy-plus/cc-gateway"
keywords = ["claude", "claude-code", "feishu", "lark", "telegram", "gateway"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cc-gateway"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.13"
bytes = "1.7"

# HTTP & WebSocket
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "local-time"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Config & paths
dirs = "5.0"

# Utils
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
once_cell = "1.20"
base64 = "0.22"
dashmap = "6.1"

# Interactive CLI (for cc-gateway without args)
rustyline = "14.0"
crossterm = "0.28"
ratatui = "0.29"

# Open URLs in default browser
open = "5"

# Path expansion
shellexpand = "3.1"

# Unicode width for terminal cursor positioning
unicode-width = "0.2"

# File locking for daemon PID file (prevents multiple instances)
fs2 = "0.4"

# Async trait support (object-safe async methods in traits)
async-trait = "0.1"

# UUID generation
uuid = { version = "1.16", features = ["v4", "serde"] }

# SQLite persistence
rusqlite = { version = "0.34", features = ["bundled"] }

# HTTP server & WebUI
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
mime_guess = "2.0"
rust-embed = { version = "8.3", features = ["include-exclude"] }
reqwest-middleware = { version = "0.4", features = ["json"] }
http = "1"
flate2 = "1.1.9"
tar = "0.4.46"
zip = "8.6.0"

# Unix signals
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
